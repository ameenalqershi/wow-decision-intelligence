name: Snapshot import
on:
  pull_request:
    paths:
      - src/Integration.Snapshots/**
      - src/Integration.Connectors/**
      - src/ModelImport/**
      - src/Udir/**
      - src/Contracts/**
      - src/Enterprise.Identity/**
      - tests/Integration.Snapshots/**
      - tests/Udir/Fixtures/**
      - .github/workflows/integration-snapshots.yml
  push:
    branches: [main]
    paths:
      - src/Integration.Snapshots/**
      - src/Integration.Connectors/**
      - src/ModelImport/**
      - src/Udir/**
      - src/Contracts/**
      - src/Enterprise.Identity/**
      - tests/Integration.Snapshots/**
      - tests/Udir/Fixtures/**
      - .github/workflows/integration-snapshots.yml
permissions:
  contents: read
jobs:
  snapshots:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Integration.Snapshots/WowDi.Integration.Snapshots.Tests.csproj --locked-mode
      - run: dotnet test tests/Integration.Snapshots/WowDi.Integration.Snapshots.Tests.csproj -c Release --no-restore
