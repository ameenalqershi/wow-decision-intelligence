name: Solver.Contracts conformance
on:
  pull_request:
    paths:
      - src/Udir/**
      - src/Solver.Contracts/**
      - src/Contracts/**
      - tests/Solver.Contracts/**
      - .github/workflows/solver.contracts.yml
  push:
    branches: [main]
    paths:
      - src/Udir/**
      - src/Solver.Contracts/**
      - src/Contracts/**
      - tests/Solver.Contracts/**
      - .github/workflows/solver.contracts.yml
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Solver.Contracts/WowDi.Solver.Contracts.Tests.csproj --locked-mode
      - run: dotnet test tests/Solver.Contracts/WowDi.Solver.Contracts.Tests.csproj --no-restore -c Release
