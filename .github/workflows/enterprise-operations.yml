name: Enterprise operations PostgreSQL
on:
  pull_request:
    paths:
      - src/Enterprise/Operations/**
      - src/Enterprise/Persistence/**
      - src/Runtime.Governance/**
      - src/Runtime.WorkerBootstrap/**
      - tests/Runtime.Governance.Fixture/**
      - tools/run-operations-cgroup-tests.sh
      - src/Solver.Contracts/**
      - src/Enterprise.Identity/**
      - src/Udir/**
      - src/DecisionGraph/**
      - src/Contracts/**
      - tests/Enterprise.Operations/**
      - tests/Udir/Fixtures/**
      - .github/workflows/enterprise-operations.yml
  push:
    branches: [main]
    paths:
      - src/Enterprise/Operations/**
      - src/Enterprise/Persistence/**
      - src/Runtime.Governance/**
      - src/Runtime.WorkerBootstrap/**
      - tests/Runtime.Governance.Fixture/**
      - tools/run-operations-cgroup-tests.sh
      - src/Solver.Contracts/**
      - src/Enterprise.Identity/**
      - src/Udir/**
      - src/DecisionGraph/**
      - src/Contracts/**
      - tests/Enterprise.Operations/**
      - tests/Udir/Fixtures/**
      - .github/workflows/enterprise-operations.yml
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wowdi_test
          POSTGRES_PASSWORD: test-fixture-only
          POSTGRES_DB: wowdi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wowdi_test -d wowdi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WOWDI_PG: Host=127.0.0.1;Port=5432;Database=wowdi_test;Username=wowdi_test;Password=test-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pg_dump --version | grep -E "PostgreSQL\) 16\." && pg_restore --version | grep -E "PostgreSQL\) 16\."
      - run: dotnet restore tests/Enterprise.Operations/WowDi.Enterprise.Operations.Tests.csproj --locked-mode
      - run: dotnet test tests/Enterprise.Operations/WowDi.Enterprise.Operations.Tests.csproj --no-restore -c Release --filter 'Category!=OSContainment'
      - run: dotnet build src/Runtime.WorkerBootstrap/WowDi.Runtime.WorkerBootstrap.csproj -c Release
      - run: dotnet build tests/Runtime.Governance.Fixture/WowDi.Runtime.Governance.Fixture.csproj -c Release
      - name: Actual worker resource accounting with PostgreSQL
        shell: bash
        run: |
          sudo systemd-run --wait --pipe --collect --property=Delegate=yes --property="User=$(id -un)" --working-directory="$PWD" --setenv="WOWDI_TEST_DOTNET=$(readlink -f "$(command -v dotnet)")" --setenv="WOWDI_PG=$WOWDI_PG" /bin/bash "$PWD/tools/run-operations-cgroup-tests.sh"
