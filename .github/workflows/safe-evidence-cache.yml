name: Exact evidence cache conformance
on:
  pull_request:
    paths:
      - src/Optimization.Cache/**
      - src/Udir/**
      - src/Contracts/**
      - src/Verification.Independent/**
      - src/Verification.Bounds/**
      - src/Verification.Evidence/**
      - src/Optimization.Fingerprints/**
      - src/ModelRegistry/**
      - src/DecisionGraph/**
      - tests/Udir/Fixtures/**
      - src/Solver.Contracts/**
      - src/Manufacturing.Data/**
      - src/Dml.*/**
      - tests/Optimization.Cache/**
      - .github/workflows/safe-evidence-cache.yml
  push:
    branches: [main]
    paths:
      - src/Optimization.Cache/**
      - src/Udir/**
      - src/Contracts/**
      - src/Verification.Independent/**
      - src/Verification.Bounds/**
      - src/Verification.Evidence/**
      - src/Optimization.Fingerprints/**
      - src/ModelRegistry/**
      - src/DecisionGraph/**
      - tests/Udir/Fixtures/**
      - src/Solver.Contracts/**
      - src/Manufacturing.Data/**
      - src/Dml.*/**
      - tests/Optimization.Cache/**
      - .github/workflows/safe-evidence-cache.yml
permissions:
  contents: read
jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Optimization.Cache --locked-mode
      - run: dotnet test tests/Optimization.Cache --no-restore -c Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-${{ matrix.os }}
          path: tests/Optimization.Cache/TestResults/*.trx
