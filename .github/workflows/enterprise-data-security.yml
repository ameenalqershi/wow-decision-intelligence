name: Enterprise data security
on:
  pull_request:
    paths:
      - src/Enterprise/DataSecurity/**
      - src/Enterprise/DataSecurity.Postgres/**
      - src/Enterprise/Persistence/**
      - src/Enterprise.Identity/**
      - src/Integration.Snapshots/**
      - src/Integration.Connectors/**
      - src/ModelImport/**
      - tests/Enterprise.DataSecurity/**
      - tests/Enterprise.DataSecurity.Postgres/**
      - tests/Udir/Fixtures/**
      - .github/workflows/enterprise-data-security.yml
  push:
    branches: [main]
    paths:
      - src/Enterprise/DataSecurity/**
      - src/Enterprise/DataSecurity.Postgres/**
      - src/Enterprise/Persistence/**
      - src/Enterprise.Identity/**
      - src/Integration.Snapshots/**
      - src/Integration.Connectors/**
      - src/ModelImport/**
      - tests/Enterprise.DataSecurity/**
      - tests/Enterprise.DataSecurity.Postgres/**
      - tests/Udir/Fixtures/**
      - .github/workflows/enterprise-data-security.yml
permissions:
  contents: read
jobs:
  data-security:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Enterprise.DataSecurity/WowDi.Enterprise.DataSecurity.Tests.csproj --locked-mode
      - run: dotnet test tests/Enterprise.DataSecurity/WowDi.Enterprise.DataSecurity.Tests.csproj --no-restore -c Release
  postgres-movement:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wowdi_test
          POSTGRES_PASSWORD: test-fixture-only
          POSTGRES_DB: wowdi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wowdi_test -d wowdi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WOWDI_PG: Host=127.0.0.1;Port=5432;Database=wowdi_test;Username=wowdi_test;Password=test-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pg_dump --version | grep -E "PostgreSQL\) 16\." && pg_restore --version | grep -E "PostgreSQL\) 16\."
      - run: dotnet restore tests/Enterprise.DataSecurity.Postgres/WowDi.Enterprise.DataSecurity.Postgres.Tests.csproj --locked-mode
      - run: dotnet test tests/Enterprise.DataSecurity.Postgres/WowDi.Enterprise.DataSecurity.Postgres.Tests.csproj --no-restore -c Release
