name: Decision graph semantics
on:
  pull_request:
    paths:
      - src/DecisionGraph/**
      - tests/DecisionGraph/**
      - .github/workflows/decision-graph.yml
  push:
    branches: [main]
    paths:
      - src/DecisionGraph/**
      - tests/DecisionGraph/**
      - .github/workflows/decision-graph.yml
permissions:
  contents: read
jobs:
  graph:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/DecisionGraph/WowDi.DecisionGraph.Tests.csproj --locked-mode
      - run: dotnet test tests/DecisionGraph/WowDi.DecisionGraph.Tests.csproj --no-restore -c Release
