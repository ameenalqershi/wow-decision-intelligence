name: Exact affine lowering conformance
on:
  pull_request:
    paths:
      - src/Udir/**
      - src/Dml.Syntax/**
      - src/Dml.Binding/**
      - src/Dml.Semantics/**
      - src/Dml.Lowering/**
      - src/Solver.Planning/**
      - tests/Solver.Planning/**
      - src/Runtime.Governance/**
      - tests/Dml.Lowering/**
      - src/Verification.Independent/**
      - src/Solver.Contracts/**
      - src/Manufacturing.Data/**
      - tests/Dml.Semantics/**
      - tests/Dml.Binding/**
      - tests/Udir/Fixtures/**
      - src/Contracts/**
      - tests/Dml.Syntax/**
      - .github/workflows/solver-planning.yml
  push:
    branches: [main]
    paths:
      - src/Udir/**
      - src/Dml.Syntax/**
      - src/Dml.Binding/**
      - src/Dml.Semantics/**
      - src/Dml.Lowering/**
      - src/Solver.Planning/**
      - tests/Solver.Planning/**
      - src/Runtime.Governance/**
      - tests/Dml.Lowering/**
      - src/Verification.Independent/**
      - src/Solver.Contracts/**
      - src/Manufacturing.Data/**
      - tests/Dml.Semantics/**
      - tests/Dml.Binding/**
      - tests/Udir/Fixtures/**
      - src/Contracts/**
      - tests/Dml.Syntax/**
      - .github/workflows/solver-planning.yml
permissions:
  contents: read
jobs:
  solver-planning:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Solver.Planning/WowDi.Solver.Planning.Tests.csproj --locked-mode
      - run: dotnet test tests/Solver.Planning/WowDi.Solver.Planning.Tests.csproj --no-restore -c Release
