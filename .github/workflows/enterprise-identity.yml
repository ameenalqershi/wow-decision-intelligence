name: Enterprise identity
on:
  pull_request:
    paths:
      - src/Enterprise.Identity/**
      - tests/Enterprise.Identity/**
      - .github/workflows/enterprise-identity.yml
  push:
    branches: [main]
    paths:
      - src/Enterprise.Identity/**
      - tests/Enterprise.Identity/**
      - .github/workflows/enterprise-identity.yml
permissions:
  contents: read
jobs:
  identity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Enterprise.Identity/WowDi.Enterprise.Identity.Tests.csproj --locked-mode
      - run: dotnet test tests/Enterprise.Identity/WowDi.Enterprise.Identity.Tests.csproj --no-restore -c Release
