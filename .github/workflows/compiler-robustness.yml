name: Compiler and independent verifier robustness
on:
  pull_request:
    paths:
      - src/Contracts/**
      - src/Udir/**
      - src/Dml.*/**
      - src/Solver.Contracts/**
      - src/Verification.*/**
      - src/Manufacturing.Data/**
      - tests/CompilerRobustness/**
      - .github/workflows/compiler-robustness.yml
  push:
    branches: [main]
    paths:
      - src/Contracts/**
      - src/Udir/**
      - src/Dml.*/**
      - src/Solver.Contracts/**
      - src/Verification.*/**
      - src/Manufacturing.Data/**
      - tests/CompilerRobustness/**
      - .github/workflows/compiler-robustness.yml
permissions:
  contents: read
jobs:
  robustness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/CompilerRobustness/WowDi.CompilerRobustness.Tests.csproj --locked-mode
      - run: dotnet test tests/CompilerRobustness/WowDi.CompilerRobustness.Tests.csproj --no-restore -c Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-robustness-${{ matrix.os }}
          path: tests/CompilerRobustness/TestResults/*.trx
          if-no-files-found: warn
