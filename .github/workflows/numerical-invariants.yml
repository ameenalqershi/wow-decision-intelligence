name: Numerical invariants
on:
  pull_request:
    paths:
      - src/Contracts/**
      - src/Udir/**
      - src/Dml.*/**
      - src/Solver.Contracts/**
      - src/Verification.*/**
      - src/Manufacturing.Data/**
      - tests/Numerical.Invariants/**
      - .github/workflows/numerical-invariants.yml
  push:
    branches: [main]
    paths:
      - src/Contracts/**
      - src/Udir/**
      - src/Dml.*/**
      - src/Solver.Contracts/**
      - src/Verification.*/**
      - src/Manufacturing.Data/**
      - tests/Numerical.Invariants/**
      - .github/workflows/numerical-invariants.yml
permissions:
  contents: read
jobs:
  numerical-invariants:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Numerical.Invariants/WowDi.Numerical.Invariants.Tests.csproj --locked-mode
      - run: dotnet test tests/Numerical.Invariants/WowDi.Numerical.Invariants.Tests.csproj -c Release --no-restore
