name: Verify research and scope
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build research/ComponentStudy -c Release
      - run: dotnet run --project research/ComponentStudy -c Release --no-build
      - run: dotnet restore research/ScheduleStudy --locked-mode
      - run: dotnet run --project research/ScheduleStudy -c Release --no-restore
      - run: dotnet restore research/CoverageStudy --locked-mode
      - run: dotnet run --project research/CoverageStudy -c Release --no-restore
      - run: node planning/validate.mjs
