name: Verify research and scope
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project research/ComponentStudy -c Release
      - run: dotnet restore research/ScheduleStudy --locked-mode
      - run: dotnet run --project research/ScheduleStudy -c Release --no-restore
      - run: dotnet restore research/CoverageStudy --locked-mode
      - run: dotnet run --project research/CoverageStudy -c Release --no-restore
      - run: node planning/validate.mjs
      - run: dotnet run --project tools/Traceability -c Release
      - name: Verify archived design sources
        shell: bash
        run: cd docs/design/references && sha256sum -c SHA256SUMS
  github-ledger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compare planning with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" > "$RUNNER_TEMP/issues.json"
          dotnet run --project tools/Traceability -- --github "$RUNNER_TEMP/issues.json"
      - name: Reject broken plans and verify extracted references
        run: |
          bash tools/Traceability/check-fixtures.sh
          cd docs/design/references
          for file in *.svg *.png IMPLEMENTATION-SPEC.md; do
            unzip -p WOW-DI-UI-Design-References.zip "$file" | cmp - "$file"
          done
      - name: Check the editable dependency drawing
        run: |
          dotnet run --project tools/Traceability -- --write-dependency-graph
          git diff --exit-code -- docs/audit/diagrams/dependencies.dot
