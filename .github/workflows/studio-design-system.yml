name: Studio design system
on:
  push:
    branches: [main]
    paths: ['apps/Studio/**', 'tests/Studio/**', '.github/workflows/studio-design-system.yml', 'docs/design/references/**']
  pull_request:
    paths: ['apps/Studio/**', 'tests/Studio/**', '.github/workflows/studio-design-system.yml', 'docs/design/references/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tokens:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore tests/Studio/DesignSystem --locked-mode
      - name: Test tokens and render Razor gallery
        shell: pwsh
        run: |
          $env:WOWDI_GALLERY_OUTPUT = Join-Path $env:RUNNER_TEMP "ds01"
          dotnet test tests/Studio/DesignSystem -c Release --no-restore
      - name: Browser style and keyboard checks
        shell: pwsh
        run: |
          $gallery = Join-Path $env:RUNNER_TEMP "ds01"
          if ($IsWindows) {
            $chrome = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          } else {
            $chrome = (Get-Command google-chrome).Source
          }
          node tests/Studio/DesignSystem/browser-check.mjs $chrome (Join-Path $gallery "gallery.html") (Join-Path $gallery "gallery.png") | Tee-Object -FilePath (Join-Path $gallery "browser.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds01-${{ matrix.os }}
          path: ${{ runner.temp }}/ds01
