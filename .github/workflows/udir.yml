name: UDIR compatibility
on:
  pull_request:
    paths:
      - src/Udir/**
      - src/Contracts/**
      - tests/Udir/**
      - .github/workflows/udir.yml
  push:
    branches: [main]
    paths:
      - src/Udir/**
      - src/Contracts/**
      - tests/Udir/**
      - .github/workflows/udir.yml
permissions:
  contents: read
jobs:
  udir:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Udir/WowDi.Udir.Tests.csproj --locked-mode
      - run: dotnet test tests/Udir/WowDi.Udir.Tests.csproj --no-restore -c Release
